<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>JexFold README Preview</title>
    <script>
      window.__JEXFOLD_README_PREVIEW__ = true;
      window.__JEXFOLD_PREVIEW_LOCALE__ = 'ru';
      window.__timelines = window.__timelines || {};
    </script>
    <style>
      html,
      body,
      #hf-root,
      #app-root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #hf-root {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      #readme-background {
        position: absolute;
        z-index: 0;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(900px 630px at 10% -12%, rgba(255, 226, 141, 0.7), transparent 65%),
          radial-gradient(850px 630px at 100% 4%, rgba(250, 193, 168, 0.52), transparent 68%),
          #fff8e8;
      }
      #readme-background::after {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.13;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 10 10' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='%2313193D' fill-opacity='.22' d='M1 1h1v1H1zM6 3h1v1H6zM3 7h1v1H3zM8 8h1v1H8z'/%3E%3C/svg%3E");
        background-size: 10px 10px;
        mix-blend-mode: multiply;
      }
      #app-root {
        position: relative;
        z-index: 1;
        zoom: 0.64;
      }
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="hf-mlpp"
      id="hf-root"
      data-composition-id="jexfold-readme-preview"
      data-width="1280"
      data-height="720"
      data-duration="7"
      data-fps="15"
    >
      <div id="readme-background" aria-hidden="true"></div>
      <div data-hf-id="hf-ip4f" id="app-root"></div>
    </div>
    <script type="module" src="../src/preview-main.tsx"></script>
  </body>
</html>
