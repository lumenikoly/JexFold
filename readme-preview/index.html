<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>JexFold README Preview</title>
    <script>
      window.__JEXFOLD_README_PREVIEW__ = true;
      window.__timelines = window.__timelines || {};
    </script>
    <style>
      html,
      body,
      #hf-root,
      #app-root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #app-root {
        zoom: 0.64;
      }
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="hf-mlpp"
      id="hf-root"
      data-composition-id="jexfold-readme-preview"
      data-width="1280"
      data-height="720"
      data-duration="7"
      data-fps="15"
    >
      <div data-hf-id="hf-ip4f" id="app-root"></div>
    </div>
    <script type="module" src="../src/preview-main.tsx"></script>
  </body>
</html>
