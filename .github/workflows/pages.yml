name: Web / GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      VITE_BASE_PATH: /JexFold/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - uses: actions/cache@v4
        with:
          path: |
            .tools/libjxl-v0.12.0
            .tools/wasm-v0.12.0
          key: jexfold-wasm-${{ runner.os }}-emsdk-3.1.74-${{ hashFiles('wasm/**', 'scripts/build-wasm.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run wasm:build
      - run: pnpm run web:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
