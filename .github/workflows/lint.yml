name: Lint and format

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm run lint:web
      - name: TypeScript
        run: pnpm run typecheck
      - name: Prettier
        run: pnpm exec prettier --check .

  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - name: Install native lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy libjxl-dev shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: C++ format
        run: clang-format --dry-run --Werror wasm/src/jexfold_codec.cc
      - name: Clang-Tidy
        run: clang-tidy wasm/src/jexfold_codec.cc -- -std=c++17
      - name: ShellCheck
        run: node scripts/lint-shell.mjs
      - name: Actionlint
        run: actionlint
